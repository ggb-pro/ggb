server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Health check (no rate limit)
    location /health {
        proxy_pass http://knspace_backend;
        proxy_set_header Host $host;
    }

    # SSE streaming endpoints — disable buffering for real-time tokens
    location /api/v1/chat {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://knspace_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: no buffering, long timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Document upload — separate rate limit
    location /api/v1/documents/upload {
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://knspace_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 600s;
    }

    # All other API routes
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://knspace_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Metrics endpoint (no external access — only localhost)
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://knspace_backend;
    }

    location / {
        return 404 '{"detail":"Not found"}';
        default_type application/json;
    }
}
